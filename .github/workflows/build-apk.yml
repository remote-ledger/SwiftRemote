name: build-apk

# Upstream ships only a no-op release workflow, so this fork builds its own
# signed APK. The signing key lives in repository secrets rather than the
# auto-generated Android debug key, which a fresh runner regenerates on every
# run -- that would give each build a different signature and stop Android
# from installing one over the last.

on:
  workflow_dispatch:
  push:
    branches:
      - fix/github-store-stale-search

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3.38.6 is the revision upstream's release.yml pins, and what
      # pubspec.lock resolves against (flutter >=3.38.4, dart >=3.11.0).
      # Current stable makes IconData a final class, which the pinned
      # font_awesome_flutter 10.12.0 still extends, so the build breaks there.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SWIFTREMOTE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SWIFTREMOTE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::Signing secrets are missing; a release build would be unsigned."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/swiftremote.jks
          # build.gradle reads this file and resolves storeFile relative to android/app.
          {
            echo "storeFile=swiftremote.jks"
            echo "keyAlias=swiftremote"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > android/app/key.properties

      # assets/db/irblaster.sqlite is declared in pubspec.yaml but gitignored;
      # it is generated from the committed SQL dump. Without this, asset
      # bundling fails with "Error detected in pubspec.yaml".
      - name: Generate the bundled IR database
        run: python3 tools/build_ir_db.py

      # The app builds IconData dynamically (macro editor, remote studio,
      # remote view), and release builds tree-shake icons, which requires
      # every IconData to be const. Ship the full icon font instead.
      - run: flutter build apk --release --no-tree-shake-icons

      - name: Drop the key material
        if: always()
        run: rm -f android/app/swiftremote.jks android/app/key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: swiftremote-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
