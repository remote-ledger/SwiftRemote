name: build-apk

# Upstream ships only a no-op release workflow, so this fork builds its own
# signed APK. The signing key lives in repository secrets rather than the
# auto-generated Android debug key, which a fresh runner regenerates on every
# run -- that would give each build a different signature and stop Android
# from installing one over the last.
#
# release.yml calls this workflow, so the APK attached to a release is built
# by exactly these steps rather than a second copy of them that can drift.

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      apk-name:
        description: File name of the built APK.
        value: ${{ jobs.apk.outputs.apk-name }}
      version:
        description: Version from pubspec.yaml, without the build number.
        value: ${{ jobs.apk.outputs.version }}
  push:
    branches:
      - master
  # Without this the gate below only ever saw code that was already merged,
  # which is the wrong end of the process to find out at. Note that analyze
  # and test would not have caught the change that prompted this: deleting
  # res/values/colors.xml breaks nothing a Dart analyzer can see, and only
  # the Gradle build fails if a resource still points at it. So a pull
  # request builds the APK too, rather than stopping at the cheap checks.
  #
  # A branch in this repository can read the signing secrets, so that build
  # is signed like any other. One from a fork cannot, and stops at the guard
  # in "Restore the signing key" with a message saying exactly that.
  pull_request:
    branches:
      - master

jobs:
  apk:
    runs-on: ubuntu-latest
    outputs:
      apk-name: ${{ steps.name.outputs.apk }}
      version: ${{ steps.name.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3.38.6 is the revision upstream's release.yml pins, and what
      # pubspec.lock resolves against (flutter >=3.38.4, dart >=3.11.0).
      # Current stable makes IconData a final class, which the pinned
      # font_awesome_flutter 10.12.0 still extends, so the build breaks there.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get

      # assets/db/swiftremote.sqlite is declared in pubspec.yaml but gitignored;
      # it is generated from the committed SQL dump. Everything downstream
      # wants it there: the build bundles it, flutter test bundles the
      # declared assets too, and flutter analyze checks that a declared asset
      # exists at all, so this comes before the three of them.
      - name: Generate the bundled IR database
        run: python3 tools/build_ir_db.py

      # The analyzer has never run here, so nothing has been stopping a lint or
      # a stale import from reaching master. It goes before the Gradle build
      # because it answers in seconds rather than minutes, and before the
      # signing key is restored so a lint failure never leaves key material
      # sitting on the runner.
      #
      # Infos are fatal too. The 76 the project carried have been cleared, so
      # the next one to appear will be new, and a gate that only fails on
      # things nobody introduced today is the kind people learn to scroll
      # past.
      - name: Analyze the Dart sources
        run: flutter analyze

      # These tests pin the IR encoders to their expected timings, and a
      # regression there stays invisible until a remote stops working in
      # someone's living room. release.yml calls this workflow, so a red test
      # stops the release rather than turning up after the APK is attached.
      - name: Run the unit tests
        run: flutter test

      - name: Read the app version
        id: name
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version: *\([0-9][^+ ]*\).*/\1/p' pubspec.yaml)
          if [ -z "$version" ]; then
            echo "::error::Could not read version from pubspec.yaml"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "apk=swiftremote-$version.apk" >> "$GITHUB_OUTPUT"

      - name: Restore the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.SWIFTREMOTE_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.SWIFTREMOTE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ] || [ -z "${KEYSTORE_PASSWORD:-}" ]; then
            echo "::error::Signing secrets are missing; a release build would be unsigned."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > android/app/swiftremote.jks
          # build.gradle reads this file and resolves storeFile relative to android/app.
          {
            echo "storeFile=swiftremote.jks"
            echo "keyAlias=swiftremote"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyPassword=$KEYSTORE_PASSWORD"
          } > android/app/key.properties

      # The app builds IconData dynamically (macro editor, remote studio,
      # remote view), and release builds tree-shake icons, which requires
      # every IconData to be const. Ship the full icon font instead.
      - run: flutter build apk --release --no-tree-shake-icons

      # The in-app updater downloads the first .apk attached to a release, so
      # the file carries the version rather than Flutter's generic name.
      - name: Name the APK after the version
        run: |
          set -euo pipefail
          mv build/app/outputs/flutter-apk/app-release.apk \
             "build/app/outputs/flutter-apk/${{ steps.name.outputs.apk }}"

      - name: Drop the key material
        if: always()
        run: rm -f android/app/swiftremote.jks android/app/key.properties

      - uses: actions/upload-artifact@v4
        with:
          name: swiftremote-release-apk
          path: build/app/outputs/flutter-apk/${{ steps.name.outputs.apk }}
          if-no-files-found: error
