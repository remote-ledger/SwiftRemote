name: build-apk

# Upstream ships only a no-op release workflow, so this fork builds its own
# sideloadable APK. Debug signing is deliberate: it needs no secrets, and the
# artifact is for the maintainer of this fork rather than for distribution.

on:
  workflow_dispatch:
  push:
    branches:
      - fix/github-store-stale-search

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3.38.6 is the revision upstream's release.yml pins, and what
      # pubspec.lock resolves against (flutter >=3.38.4, dart >=3.11.0).
      # Current stable makes IconData a final class, which the pinned
      # font_awesome_flutter 10.12.0 still extends, so the build breaks there.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.6'
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
        continue-on-error: true
      - run: flutter build apk --debug

      - uses: actions/upload-artifact@v4
        with:
          name: ir-blaster-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
